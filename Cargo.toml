[package]
name = "mouse-battery-gpui"
version = "2.9.0"
edition = "2024"
[dependencies]
battery-protocol = {path="../mouse-battery-core"}
gpui = {version="=0.2.2", default-features=false, features=["windows-manifest"]}
serde = {version="1", features=["derive"]}
serde_json = "1"
tray-icon = "=0.24.2"
async-channel = "2"
tempfile = "3"
raw-window-handle = "0.6"
crossbeam-channel = "0.5"
windows-sys = {version="=0.61.2",features=["Win32_Foundation","Win32_Storage_FileSystem","Win32_Security","Win32_System_Threading","Win32_System_Power","Win32_System_Registry","Win32_System_LibraryLoader","Win32_UI_WindowsAndMessaging","Win32_UI_Shell","Win32_Graphics_Gdi","Win32_UI_HiDpi","Win32_Globalization"]}
unicode-segmentation = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots", "system-proxy"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
sha2 = "0.10"
ed25519-dalek = "2"
semver = "1"
hex = "0.4"

chrono = {version="0.4", default-features=false,features=["clock"]}

image = {version="0.25", default-features=false, features=["webp"]}

[build-dependencies]
embed-resource = "=3.0.12"

[dev-dependencies]
image = {version="0.25", default-features=false, features=["png"]}
