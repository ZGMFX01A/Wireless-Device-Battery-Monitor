name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing stable tag, for example v2.8.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and sign Windows release
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Resolve and validate explicit release identity
        id: identity
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PRIVATE_CORE_ACCESS_TOKEN: ${{ secrets.PRIVATE_CORE_ACCESS_TOKEN }}
          GPUI_UPDATE_SIGNING_KEY: ${{ secrets.GPUI_UPDATE_SIGNING_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:INPUT_TAG
          if ([string]::IsNullOrEmpty($tag) -and $env:REF_TYPE -eq 'tag') { $tag = $env:REF_NAME }
          if ($tag -cnotmatch '^v(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})$') { throw 'An existing stable vMAJOR.MINOR.PATCH tag is required' }
          $version = $tag.Substring(1)
          foreach ($part in $version.Split('.')) { if ([uint32]$part -gt 65535) { throw 'Version field overflow' } }
          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_CORE_ACCESS_TOKEN)) { throw 'PRIVATE_CORE_ACCESS_TOKEN is required for the separate private repository' }
          if ($env:GPUI_UPDATE_SIGNING_KEY -notmatch '^[0-9a-fA-F]{64}$') { throw 'A 32-byte Ed25519 seed is required in GPUI_UPDATE_SIGNING_KEY' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Checkout the exact application tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ steps.identity.outputs.tag }}
          path: mouse-battery
          persist-credentials: false

      - name: Checkout latest private core
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ secrets.PRIVATE_CORE_REPOSITORY || 'ZGMFX01A/mouse-battery-core' }}
          # No ref: fetch the current default branch of the core repository.
          path: mouse-battery-core
          token: ${{ secrets.PRIVATE_CORE_ACCESS_TOKEN }}
          persist-credentials: false

      - name: Install the repository-pinned toolchain
        working-directory: mouse-battery
        run: |
          $toolchain = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "([0-9.]+)"$').Matches.Groups[1].Value
          if ([string]::IsNullOrEmpty($toolchain)) { throw 'Missing pinned toolchain' }
          rustup toolchain install $toolchain --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Toolchain installation failed' }

      - name: Build signing tool without access to the signing secret
        id: helper
        working-directory: mouse-battery
        run: |
          cargo build --example release_manifest
          if ($LASTEXITCODE -ne 0) { throw 'Signing tool build failed' }
          $metadata = (& cargo metadata --no-deps --locked --format-version 1 | Out-String) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to locate signing tool' }
          $path = Join-Path $metadata.target_directory 'debug/examples/release_manifest.exe'
          if (!(Test-Path $path)) { throw 'Signing tool missing' }
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Derive the public verification key
        id: signing
        working-directory: mouse-battery
        env:
          SIGNER: ${{ steps.helper.outputs.path }}
          GPUI_UPDATE_SIGNING_KEY: ${{ secrets.GPUI_UPDATE_SIGNING_KEY }}
        run: |
          $key = (& $env:SIGNER public-key | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $key -cnotmatch '^[0-9a-f]{64}$') { throw 'Unable to derive release public key' }
          "public_key=$key" >> $env:GITHUB_OUTPUT

      - name: Verify both packages and the release executable
        working-directory: mouse-battery
        env:
          GPUI_UPDATE_PUBLIC_KEY: ${{ steps.signing.outputs.public_key }}
        run: |
          ./scripts/Verify.ps1 -OutDir out/release
          $report = Get-Content out/release/evidence/verification.json -Raw | ConvertFrom-Json
          $info = (Get-Item $report.artifact.path).VersionInfo
          if ($info.ProductVersion -ne $env:APP_VERSION) { throw 'Embedded ProductVersion differs from the release tag' }
          if ($info.FileVersion -ne "$($env:APP_VERSION).0") { throw 'Embedded FileVersion differs from the release tag' }

      - name: Stage and sign the exact verified bytes
        working-directory: mouse-battery
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          SIGNER: ${{ steps.helper.outputs.path }}
          GPUI_UPDATE_SIGNING_KEY: ${{ secrets.GPUI_UPDATE_SIGNING_KEY }}
        run: |
          ./scripts/Prepare-Release.ps1 -Report out/release/evidence/verification.json -Tag $env:RELEASE_TAG -Dist dist
          $exe = "dist/WirelessDeviceBatteryMonitor-v$($env:APP_VERSION).exe"
          & $env:SIGNER sign $env:APP_VERSION $exe dist/gpui-windows.json
          if ($LASTEXITCODE -ne 0) { throw 'Manifest signing failed' }

      - name: Upload only release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release
          path: mouse-battery/dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Replace the release executable
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout the tagged publishing script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ needs.build.outputs.tag }}
          persist-credentials: false
      - name: Download the verified artifact set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-release
          path: dist
      - name: Verify and replace the executable on the existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          ./scripts/Publish-Release.ps1 -Tag $env:RELEASE_TAG -Repository $env:GITHUB_REPOSITORY -Dist dist
