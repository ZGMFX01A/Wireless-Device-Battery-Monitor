name: Build and Release

on:
  push:
    tags:
      - 'v*' # 推送以 v 开头的 tag 触发自动发版 (例如 v0.1.3, v2.8.0)
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布版本 Tag (例如 v0.1.3)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Windows Release
    runs-on: windows-latest

    steps:
      - name: Resolve release tag
        shell: pwsh
        run: |
          $releaseTag = "${{ inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($releaseTag) -and "${{ github.ref_type }}" -eq "tag") {
            $releaseTag = "${{ github.ref_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($releaseTag)) {
            $releaseTag = "v0.1.3"
          }

          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved release tag: $releaseTag"

      # 检出 GUI 应用主仓库至当前 runner 的 mouse-battery 子目录
      - name: Checkout mouse-battery (GUI)
        uses: actions/checkout@v4
        with:
          path: mouse-battery

      # 读取私有核心库引用配置 (private-core-ref.json)
      - name: Read private core reference
        shell: pwsh
        working-directory: mouse-battery
        run: |
          if (-not (Test-Path private-core-ref.json)) {
            throw "Missing private-core-ref.json in mouse-battery"
          }
          $refJson = Get-Content private-core-ref.json -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($refJson.ref)) {
            throw "Missing 'ref' in private-core-ref.json"
          }
          $checkoutPath = $refJson.ci_checkout_path
          if ([string]::IsNullOrWhiteSpace($checkoutPath)) {
            $checkoutPath = "mouse-battery-core"
          }

          "PRIVATE_CORE_REF=$($refJson.ref)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PRIVATE_CORE_CHECKOUT_PATH=$checkoutPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Private core ref: $($refJson.ref), path: $checkoutPath"

      # 验证私有核心库 Secrets 配置
      - name: Validate private core secrets
        shell: pwsh
        env:
          PRIVATE_CORE_REPOSITORY: ${{ secrets.PRIVATE_CORE_REPOSITORY }}
          PRIVATE_CORE_ACCESS_TOKEN: ${{ secrets.PRIVATE_CORE_ACCESS_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_CORE_REPOSITORY)) {
            Write-Host "::warning::Missing PRIVATE_CORE_REPOSITORY secret. Defaulting to ZGMFX01A/mouse-battery-core"
            "PRIVATE_CORE_REPO=ZGMFX01A/mouse-battery-core" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            "PRIVATE_CORE_REPO=$($env:PRIVATE_CORE_REPOSITORY)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_CORE_ACCESS_TOKEN)) {
            Write-Host "::warning::Missing PRIVATE_CORE_ACCESS_TOKEN secret. Attempting fallback to GITHUB_TOKEN"
            "PRIVATE_CORE_TOKEN=${{ secrets.GITHUB_TOKEN }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            "PRIVATE_CORE_TOKEN=$($env:PRIVATE_CORE_ACCESS_TOKEN)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      # 检出私有底层协议库至兄弟目录 mouse-battery-core，满足 Cargo.toml 中 path = "../mouse-battery-core"
      - name: Checkout private core repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_CORE_REPO }}
          ref: ${{ env.PRIVATE_CORE_REF }}
          path: ${{ env.PRIVATE_CORE_CHECKOUT_PATH }}
          token: ${{ env.PRIVATE_CORE_TOKEN }}

      # 校验兄弟依赖路径与 Cargo.lock 完整性
      - name: Verify dependency paths
        shell: pwsh
        run: |
          $coreCargo = Join-Path $env:PRIVATE_CORE_CHECKOUT_PATH "Cargo.toml"
          if (-not (Test-Path $coreCargo)) {
            throw "Failed to locate private core at: $coreCargo"
          }
          Write-Host "Private core found at: $coreCargo"

          # 确保如果存在顶层或者同级寻找，创建符号链接双重保险
          $siblingPath = Join-Path "mouse-battery" "..\" $env:PRIVATE_CORE_CHECKOUT_PATH
          Write-Host "Sibling path resolves to: $((Resolve-Path $siblingPath).Path)"

      # 设置稳定版 Rust 工具链
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 启用 Cargo 依赖构建缓存加速构建
      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mouse-battery -> target

      # 执行自动化单元与协议回归测试
      - name: Run Test Suite
        shell: pwsh
        working-directory: mouse-battery
        run: |
          cargo test --verbose

      # 编译发布版原生二进制 (Release Profile)
      - name: Build Release Binary
        shell: pwsh
        working-directory: mouse-battery
        run: |
          cargo build --release --locked

      # 执行二进制冒烟自检，防止打包损坏产物
      - name: Smoke Test Release Executable
        shell: pwsh
        working-directory: mouse-battery
        run: |
          $exe = Resolve-Path "target/release/mouse-battery-gpui.exe"
          Write-Host "Running smoke test on: $exe"
          & $exe --smoke-test
          if ($LASTEXITCODE -ne 0) {
            throw "Executable smoke test failed with exit code $LASTEXITCODE"
          }
          Write-Host "Smoke test passed successfully."

      # 归档重命名二进制并计算 SHA-256 哈希
      - name: Prepare Release Artifacts
        shell: pwsh
        working-directory: mouse-battery
        run: |
          $tag = $env:RELEASE_TAG
          $dist = New-Item -ItemType Directory -Force -Path "dist"
          $primaryExe = "WirelessDeviceBatteryMonitor-$tag.exe"
          $distExePath = Join-Path $dist.FullName $primaryExe

          Copy-Item "target/release/mouse-battery-gpui.exe" $distExePath

          # 生成 SHA-256 校验和文件
          $hash = (Get-FileHash -Path $distExePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $primaryExe" | Out-File -FilePath (Join-Path $dist.FullName "$primaryExe.sha256") -Encoding ascii

          "EXE_NAME=$primaryExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release binary prepared: $primaryExe (SHA-256: $hash)"

      # 上传构建产物作为 Actions 构件 (供手动验证/下载)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXE_NAME }}
          path: mouse-battery/dist/*
          if-no-files-found: error

      # 正式创建 GitHub Release 并上传发行文件
      - name: Publish GitHub Release
        shell: pwsh
        working-directory: mouse-battery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          $assets = (Get-Item "dist/*").FullName

          # 检查 Release 是否已存在，不存在则自动创建
          gh release view "$tag" --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Creating GitHub Release $tag..."
            gh release create "$tag" `
              --repo "$env:GITHUB_REPOSITORY" `
              --target "$env:GITHUB_SHA" `
              --title "$tag" `
              --generate-notes
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub release: $tag"
            }
          }

          Write-Host "Uploading release assets to $tag..."
          gh release upload "$tag" $assets `
            --repo "$env:GITHUB_REPOSITORY" `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload release assets to $tag"
          }
          Write-Host "GitHub Release $tag published successfully."
