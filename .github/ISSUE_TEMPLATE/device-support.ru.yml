name: Поддержка устройства (Русский)
description: Запрос поддержки конкретного устройства или сообщение о проблемах с определением, зарядом батареи, зарядкой и подключением.
title: "[Поддержка устройства] Производитель + полная модель + способ подключения"
body:
  - type: markdown
    attributes:
      value: |
        > [!CAUTION]
        > **Перед отправкой заявки обязательно выполните оба шага (заявки без проверки или с фиктивными галочками будут закрыты):**
        >
        > 1. **Сначала проверьте «Совместимый режим» в программе**: откройте **Настройки → Режим распознавания → Совместимый режим (экспериментальный)**; если устройство не найдено, также включите **Поиск неизвестных устройств (эксп.)** и повторите сканирование. Многие устройства уже определяются в этом режиме (возможно, под общим названием).
        > 2. **Лично убедитесь, что официальный клиент / драйвер показывает точный заряд**: вы должны **самостоятельно видеть точный процент заряда** через официальную утилиту, официальный веб-драйвер, настройки Windows или другую программу. Если вы сами нигде не видите точный заряд, источника для анализа и сверки нет — **НЕ ставьте галочки ниже и НЕ отправляйте заявку.**

        Укажите **полное название модели, включая суффиксы Pro / Max / SE, поколение и версию**, и приложите **официальную ссылку на скачивание драйвера или официальный веб-драйвер** (если официального драйвера нет и заряд виден через другую программу, укажите её название и ссылку).
        Устройства одной серии, с одинаковым внешним видом или VID могут использовать разные протоколы чтения заряда. Опишите результаты отдельно для каждого способа подключения.

        Подробности — в [инструкции по сбору сведений об устройстве](https://github.com/ZGMFX01A/Wireless-Device-Battery-Monitor/blob/main/docs/device-support.md#русский).

  - type: checkboxes
    id: battery-visibility-confirm
    attributes:
      label: Обязательное подтверждение (НЕ отмечайте без проверки)
      description: Необходимо сначала проверить совместимый режим и убедиться, что официальный клиент/драйвер или другой способ показывает точный заряд. Заявки с ложным подтверждением закрываются сразу.
      options:
        - label: "Я проверил(а) «Совместимый режим (экспериментальный)» и «Поиск неизвестных устройств (эксп.)», выполнил(а) сканирование и честно указал(а) результат ниже"
          required: true
        - label: "Я лично убедился(лась), что официальный клиент, официальный веб-драйвер, Windows или другая программа сейчас действительно показывает точный заряд (НЕ отмечайте, если не видите точный заряд)"
          required: true

  - type: dropdown
    id: compatible-mode-test
    attributes:
      label: Результат проверки в совместимом режиме (проверьте в программе)
      description: Включите «Совместимый режим (экспериментальный)» в «Настройки → Режим распознавания»; если устройство не найдено, включите также «Поиск неизвестных устройств (эксп.)» и повторите сканирование.
      options:
        - "Включены «Совместимый режим» + «Поиск неизвестных устройств»: устройство не найдено"
        - "Включены «Совместимый режим» + «Поиск неизвестных устройств»: найдено, но заряд неверный / не читается / статус сбоит"
        - "Включены «Совместимый режим» + «Поиск неизвестных устройств»: заряд читается точно, но только общее имя или мелкие сбои"
        - "Включён только «Совместимый режим» (без «Поиска неизвестных устройств»): не найдено или сбои"
        - "Уже поддерживается в обычном режиме, но есть ошибка (неверный %, ложная зарядка, проблемы после сна и т. д.)"
    validations:
      required: true

  - type: input
    id: device-model
    attributes:
      label: Производитель и полная модель устройства
      description: Перепишите модель с упаковки, наклейки или официальной страницы товара. Одного названия производителя, серии или общего описания недостаточно.
      placeholder: Производитель + полная модель + поколение/версия; аппаратная ревизия, если известна
    validations:
      required: true

  - type: textarea
    id: official-driver
    attributes:
      label: Ссылка на официальный драйвер, веб-драйвер или программу, показывающую заряд
      description: Укажите хотя бы одну официальную ссылку для этой модели. Если на странице нужно выбрать модель или версию, уточните выбор. Для веб-драйвера укажите страницу управления устройством. Если официального драйвера нет и заряд виден через Windows (например, заряд Bluetooth) или другую программу, укажите точное название, способ и ссылку на скачивание.
      placeholder: |
        Официальная ссылка на скачивание драйвера:
        Официальный веб-драйвер:
        Другая программа/способ показа заряда и ссылка (если применимо):
        Модель/версия для выбора на странице, если требуется:
    validations:
      required: true

  - type: dropdown
    id: connection-mode
    attributes:
      label: Способы подключения, при которых возникает проблема
      multiple: true
      options:
        - USB-приёмник 2,4 ГГц
        - Bluetooth
        - USB-кабель
        - Другое (уточните в описании проблемы)
    validations:
      required: true

  - type: input
    id: receiver-model
    attributes:
      label: Модель приёмника и сопряжённые устройства
      description: Уточните, используется ли комплектный, заменённый, общий или высокочастотный приёмник, и перечислите сопряжённые устройства. Для подключения только по Bluetooth или кабелю оставьте поле пустым.
      placeholder: Полная модель приёмника, режим 1K/4K/8K или другой, сопряжённые устройства

  - type: textarea
    id: versions
    attributes:
      label: Версии приложения, Windows и прошивки
      description: Укажите фактические версии. Если версия прошивки или драйвера неизвестна, напишите «неизвестно», не угадывайте.
      placeholder: |
        Версия этого приложения:
        Версия и сборка Windows (запустите winver):
        Версия прошивки устройства:
        Версия прошивки приёмника (уточните, если неприменимо):
        Название и версия официальной утилиты (уточните, если это веб-драйвер):
    validations:
      required: true

  - type: textarea
    id: symptoms
    attributes:
      label: Текущее поведение и шаги воспроизведения
      description: Опишите отсутствие устройства, неверное название или заряд, отсутствие обновлений либо неверный статус зарядки/подключения. Укажите последовательность действий, фактический и ожидаемый результат.
      placeholder: |
        Шаги воспроизведения:
        Фактический результат:
        Ожидаемый результат:
    validations:
      required: true

  - type: textarea
    id: official-driver-behavior
    attributes:
      label: Показания в клиенте/способе, где виден точный заряд (укажите реальные цифры)
      description: "**Обязательно укажите лично проверенные точный процент и статус зарядки (например: «82%, разряжается»); не угадывайте.** Если ни официальная утилита, ни веб-драйвер, ни Windows не показывают точный заряд — не подавайте заявку. Сравните с нашим приложением (включая совместимый режим) в один момент и опишите работу при открытой и закрытой утилите."
      placeholder: |
        Через какой клиент/способ сейчас виден точный заряд:
        Точный процент заряда и статус зарядки там (обязательно):
        Показания этого приложения в тот же момент (Обычный / Совместимый режим):
        При работающем официальном клиенте:
        После закрытия клиента (для веб-драйвера закройте вкладки):
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Сбор идентификаторов устройства

        Подключите устройство и выведите его из спящего режима, затем выполните всю команду ниже в **Windows PowerShell**. Знать VID/PID заранее не нужно. Команда только читает присутствующие узлы USB, HID и распространённых Bluetooth-устройств; она не отправляет команды чтения заряда или изменения настроек.

        ```powershell
        Get-CimInstance -ClassName Win32_PnPEntity -Filter 'Present = True' -ErrorAction Stop |
          Where-Object { $_.PNPDeviceID -match '^(USB|HID|BTHENUM|BTHLEDEVICE|BTHLE)\\' } |
          Sort-Object PNPClass, Name, PNPDeviceID |
          Format-List Name, Manufacturer, PNPClass, Status, ConfigManagerErrorCode, PNPDeviceID,
            @{Name='HardwareID'; Expression={$_.HardwareID -join "`n"}},
            @{Name='CompatibleID'; Expression={$_.CompatibleID -join "`n"}}
        ```

        Для USB / 2,4 ГГц выполните команду **при подключённом приёмнике/кабеле и повторно после его отключения**. Сравните появившиеся или исчезнувшие записи и приложите **все записи целевого устройства**, включая разные интерфейсы `MI_XX` / `COLXX` с одинаковыми VID/PID.
        Выключение беспроводного устройства обычно не удаляет запись подключённого приёмника. Узлы сопряжения Bluetooth могут сохраняться после отключения; укажите состояние подключения, не определяйте его только по наличию узла.

        Перед публикацией можно скрыть серийный номер или Bluetooth-адрес в последнем сегменте пути экземпляра `PNPDeviceID`. Сохраните поля VID, PID, REV, MI, COL, UP и U в аппаратных идентификаторах.

  - type: textarea
    id: device-identification
    attributes:
      label: Вывод команды сбора идентификаторов
      description: Вставьте все записи целевого устройства, а не только первую запись HID. Если команда завершилась ошибкой или ничего не вывела, приложите ошибку или сообщите о пустом выводе и добавьте ИД оборудования из диспетчера устройств.
      render: text
    validations:
      required: true

  - type: textarea
    id: state-changes
    attributes:
      label: Сон, зарядка и смена подключения
      description: Опишите проверенные случаи и отметьте непроверенные. Укажите сбои после сна, статус «подключено» после выключения, неверную зарядку, зависшие показания или сбои после смены подключения.
      placeholder: |
        Обновление после выхода из сна:
        После сна/выключения:
        После подключения/отключения зарядного кабеля:
        После переключения между 2,4 ГГц / Bluetooth / USB:
        После отключения/повторного подключения приёмника:

  - type: textarea
    id: screenshots
    attributes:
      label: Скриншоты и дополнительные сведения
      description: Крайне желательно приложить одновременные скриншоты официального клиента/веб-драйвера с точным зарядом И этого приложения в совместимом режиме (укажите способ подключения), а также точный текст ошибок.

  - type: markdown
    attributes:
      value: |
        ### Возможные проблемы совместимости

        - Разные прошивки, приёмники и способы подключения могут использовать разные протоколы даже у одной модели. Поддержка одного режима не гарантирует поддержку остальных.
        - Подключённый приёмник не означает, что само устройство доступно. Сон, выключение и общие приёмники могут затруднять определение состояния и принадлежности показаний.
        - Утилиты производителя или веб-драйверы могут занимать интерфейс связи. Укажите различия при работающей и закрытой утилите.
        - Некоторые устройства передают заряд крупными шагами, не сообщают статус зарядки или возвращают старые показания во время зарядки либо сна.
        - Команда даёт сведения об идентификаторах и интерфейсах, но **не полный дескриптор отчётов HID или протокол чтения заряда**. Могут потребоваться сведения о работе драйвера, протоколе и проверка владельцем устройства; отправка сведений ещё не означает завершённую поддержку.
