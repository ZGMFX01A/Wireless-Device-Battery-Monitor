name: 设备适配（简体中文）
description: 申请适配具体设备，或反馈设备识别、电量、充电及连接状态问题。
title: "[设备适配] 品牌 + 完整型号 + 连接方式"
body:
  - type: markdown
    attributes:
      value: |
        > [!CAUTION]
        > **提交前必须完成以下两项实测（缺一不可，未按要求测试或瞎勾选将直接关闭）：**
        >
        > 1. **先在软件内尝试「兼容模式」**：请打开软件 **「设置 → 识别模式 → 兼容模式（实验性）」**，若仍未发现设备，请继续开启 **「探测未知设备（实验性）」** 并重新扫描。很多设备在兼容模式下已经可以识别并读取电量（可能显示为通用名称）。
        > 2. **必须亲测确认官方客户端 / 驱动能获取到准确电量**：请确认**你自己当前就能通过官方客户端、官方网页驱动、Windows 系统设置或其他软件/方式读取到该设备的准确电量百分比**。如果你自己用任何软件都看不到准确电量，就没有可供逆向与对照的数据来源，无法适配——**请勿勾选下方确认项，也不要提交适配申请！**

        请提供**完整型号（包含 Pro / Max / SE、代数及版本等后缀）**，并附上**官方驱动下载地址或官方网页驱动地址**（若无官方驱动而是通过其他软件读取电量，请写明软件名称及地址）。
        同一系列、外观相同或 VID 相同，不代表使用相同的电量协议。请按实际连接方式分别描述结果。

        详细步骤见 [设备信息采集说明](https://github.com/ZGMFX01A/Wireless-Device-Battery-Monitor/blob/main/docs/device-support.md)。

  - type: checkboxes
    id: battery-visibility-confirm
    attributes:
      label: 提交前强制确认（请勿未实测勾选）
      description: 必须先亲测「兼容模式」并确认存在可读取准确电量的官方客户端/驱动/方式；瞎勾选将导致申请被直接关闭。
      options:
        - label: "我已在本软件中开启「兼容模式（实验性）」及「探测未知设备（实验性）」并重新扫描，且将在下方如实选择测试结果"
          required: true
        - label: "我已亲测确认：官方客户端、官方网页驱动、Windows 系统或其他软件目前确实能获取到该设备的准确电量（自己看不到准确电量请勿勾选）"
          required: true

  - type: dropdown
    id: compatible-mode-test
    attributes:
      label: 兼容模式测试结果（请先在软件内实际测试）
      description: 请在「设置 → 识别模式」开启「兼容模式（实验性）」；若仍未发现，请继续开启「探测未知设备（实验性）」并重新扫描后再如实选择。
      options:
        - "已开「兼容模式」+「探测未知设备」：完全未发现设备"
        - "已开「兼容模式」+「探测未知设备」：已发现设备，但电量不准 / 无法读取 / 状态异常"
        - "已开「兼容模式」+「探测未知设备」：电量读取正常，但仅显示通用名称或有轻微异常"
        - "仅开「兼容模式」（未开启「探测未知设备」）：未发现设备或存在异常"
        - "普通模式下已有适配但存在异常（如电量不准、误报充电、休眠异常等）"
    validations:
      required: true

  - type: input
    id: device-model
    attributes:
      label: 品牌与完整型号
      description: 请按包装、铭牌或官方产品页填写；不要只写品牌、系列名或“某某鼠标”。
      placeholder: 品牌 + 完整型号 + 代数/版本；如有硬件修订也请注明
    validations:
      required: true

  - type: textarea
    id: official-driver
    attributes:
      label: 官方驱动、网页驱动或可读取电量的软件地址
      description: 至少提供一个与该型号对应的官方地址。下载需先选型号时，请注明选项；网页驱动请给出能打开设备管理界面的地址。若无官方驱动、而是通过 Windows 系统（如蓝牙电量）或其他软件看到电量，请写明具体软件名称/获取方式及下载地址。
      placeholder: |
        官方驱动下载地址：
        官方网页驱动地址：
        其他可看到电量的软件名称/获取方式及地址（如适用）：
        页面中需要选择的型号/版本（如有）：
    validations:
      required: true

  - type: dropdown
    id: connection-mode
    attributes:
      label: 出现问题的连接方式
      multiple: true
      options:
        - 2.4G USB 接收器
        - 蓝牙
        - USB 数据线
        - 其他（请在问题描述中说明）
    validations:
      required: true

  - type: input
    id: receiver-model
    attributes:
      label: 接收器型号与配对情况
      description: 使用接收器时请注明原装、替换、共享或高回报率接收器，以及配对了哪些设备；纯蓝牙或数据线连接可留空。
      placeholder: 接收器完整型号、1K/4K/8K 等模式，以及配对设备

  - type: textarea
    id: versions
    attributes:
      label: 软件、系统与固件版本
      description: 填写实际版本；查不到的固件或驱动版本请明确写“未知”，不要猜测。
      placeholder: |
        本软件版本：
        Windows 版本与系统内部版本号（运行 winver 查看）：
        设备固件版本：
        接收器固件版本（不适用请注明）：
        官方驱动名称与版本（网页驱动请注明）：
    validations:
      required: true

  - type: textarea
    id: symptoms
    attributes:
      label: 当前表现与复现步骤
      description: 说明是完全未发现、名称错误、电量不准、不更新，还是充电/在线状态异常；写明实际结果、预期结果和操作顺序。
      placeholder: |
        复现步骤：
        实际结果：
        预期结果：
    validations:
      required: true

  - type: textarea
    id: official-driver-behavior
    attributes:
      label: 当前可看到准确电量的软件/方式表现（必填具体数值）
      description: "**必须填写你亲测看到的真实百分比和充电状态（例如“82%，未充电”），严禁含糊填写或猜测。** 如果没有任何客户端、网页驱动或系统设置能看到准确电量，请不要提交此适配请求。需同时记录同一时间本软件（含兼容模式）的读数，以及对照软件运行和退出时的差异。"
      placeholder: |
        当前通过哪款软件/方式看到准确电量：
        该软件/方式实际显示的电量百分比与充电状态（必填实测数值）：
        同一时间本软件（普通/兼容模式）的读数：
        对照软件运行时：
        对照软件退出后（网页驱动需关闭相关标签页）：
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### 采集设备识别信息

        连接并唤醒目标设备，在 **Windows PowerShell** 中完整运行下面的命令。无需填写 VID/PID；命令只读取当前存在的 USB、HID 和常见蓝牙设备节点，不发送电量查询或配置命令。

        ```powershell
        Get-CimInstance -ClassName Win32_PnPEntity -Filter 'Present = True' -ErrorAction Stop |
          Where-Object { $_.PNPDeviceID -match '^(USB|HID|BTHENUM|BTHLEDEVICE|BTHLE)\\' } |
          Sort-Object PNPClass, Name, PNPDeviceID |
          Format-List Name, Manufacturer, PNPClass, Status, ConfigManagerErrorCode, PNPDeviceID,
            @{Name='HardwareID'; Expression={$_.HardwareID -join "`n"}},
            @{Name='CompatibleID'; Expression={$_.CompatibleID -join "`n"}}
        ```

        USB / 2.4G 设备请在**插入接收器或数据线时、拔出后**各运行一次，对比新增或消失的条目，贴出目标设备的**全部相关条目**，包括同 VID/PID 下不同 `MI_XX` / `COLXX` 的条目。
        仅关闭无线设备通常不会让仍插着的接收器条目消失。蓝牙设备断开后也可能保留配对节点，请注明连接状态，不要仅靠条目是否存在判断在线。

        公开前可遮盖 `PNPDeviceID` 实例路径末段的序列号或蓝牙地址；请保留硬件标识中的 VID、PID、REV、MI、COL、UP、U 等字段。

  - type: textarea
    id: device-identification
    attributes:
      label: 设备识别命令输出
      description: 粘贴上述命令中目标设备的全部相关条目，不要只截取第一条 HID。若命令报错或没有结果，请原样说明，并附设备管理器中的硬件 ID。
      render: text
    validations:
      required: true

  - type: textarea
    id: state-changes
    attributes:
      label: 休眠、充电与连接切换
      description: 按已实际测试的情况填写，未测试请注明。留意是否存在休眠后不恢复、关机后仍在线、充电误判、电量停滞或切换连接方式后失效。
      placeholder: |
        唤醒后刷新：
        休眠/关机后：
        插入/拔出充电线后：
        切换 2.4G / 蓝牙 / USB 后：
        插拔接收器后：

  - type: textarea
    id: screenshots
    attributes:
      label: 截图与补充信息
      description: 强烈建议附上「官方客户端/网页驱动显示准确电量的截图」以及「本软件在兼容模式下的截图」（请标明连接方式），以及任何异常或错误原文。

  - type: markdown
    attributes:
      value: |
        ### 适配中可能遇到的问题

        - 同型号不同固件、接收器或连接方式可能使用不同协议；一个模式可用不代表其他模式也可用。
        - 接收器仍连接不代表外设在线；休眠、关机或共享接收器可能使在线状态和设备归属难以确认。
        - 厂商驱动或网页驱动可能占用通信接口；请如实记录其运行与退出时的差异。
        - 部分设备只上报分档电量，不提供充电状态，或在充电/休眠时返回旧值。
        - 此命令提供设备身份与接口线索，**不包含完整 HID 报告描述符或电量通信协议**；后续可能需要补充官方驱动行为、协议资料或进行实机验证，提交信息不代表已完成适配。
